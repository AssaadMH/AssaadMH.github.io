<style>
  :root{
    --ink:#14202c; --mut:#5b6b7a; --line:#d9e0e7; --accent:#1f6fd6;
    --bg:#eef1f4; --paper:#ffffff;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);
    font:13px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}

  /* screen controls (hidden when printing) */
  .bar{position:sticky;top:0;z-index:10;display:flex;gap:8px;justify-content:center;
    align-items:center;padding:10px;background:#0d1620;color:#fff}
  .bar button{font:inherit;font-size:12px;padding:6px 12px;border:1px solid #2b3f52;
    background:#16232f;color:#cfe0f0;border-radius:6px;cursor:pointer}
  .bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .bar .sp{flex:0 0 14px}

  /* the A4 sheet */
  .page{background:var(--paper);width:210mm;min-height:297mm;margin:16px auto;
    padding:16mm 16mm 14mm;box-shadow:0 6px 30px rgba(0,0,0,.18)}

  header.cv{border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:14px}
  header.cv h1{margin:0;font-size:27px;letter-spacing:.3px}
  header.cv .role{margin:3px 0 0;color:var(--accent);font-weight:600;font-size:14px}
  header.cv .contact{margin-top:9px;display:flex;flex-wrap:wrap;gap:4px 16px;
    font-size:12px;color:var(--mut)}
  header.cv .contact b{color:var(--ink);font-weight:600}

  .summary{font-size:12.5px;color:#25333f;margin:0 0 14px}

  .cols{display:flex;gap:20px}
  .main{flex:1 1 62%;min-width:0}
  .side{flex:0 0 33%}

  h2{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);
    margin:0 0 8px;padding-bottom:3px;border-bottom:1px solid var(--line)}
  section{margin-bottom:15px;break-inside:avoid}

  .item{margin-bottom:11px;break-inside:avoid}
  .item .t{font-weight:700;font-size:13px}
  .item .m{display:flex;justify-content:space-between;gap:10px;color:var(--mut);
    font-size:11.5px;margin:1px 0 2px}
  .item .m .org{font-style:italic}
  .item p{margin:2px 0 0;font-size:12px;color:#2c3a46}
  .item .tech{margin-top:3px;font-size:11px;color:var(--accent)}
  .item ul{margin:3px 0 0;padding-left:16px}
  .item ul li{font-size:12px;margin-bottom:1px;color:#2c3a46}

  .side h2{border-bottom-color:var(--line)}
  .skwrap{margin-bottom:10px}
  .skwrap .g{font-weight:700;font-size:12px;margin-bottom:3px}
  .chips{display:flex;flex-wrap:wrap;gap:4px}
  .chips span{font-size:10.5px;background:#eef4fb;color:#274a6b;border:1px solid #d5e3f2;
    border-radius:20px;padding:2px 8px}
  .langs div{font-size:12px;margin-bottom:3px}
  .langs b{font-weight:600}
  .langs em{color:var(--mut);font-style:normal}

  ul.tight{margin:2px 0 0;padding-left:16px}
  ul.tight li{font-size:12px;margin-bottom:3px;color:#2c3a46}

  footer.cv{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--mut);text-align:center}

  @media print{
    .bar{display:none}
    body{background:#fff}
    .page{width:auto;min-height:0;margin:0;box-shadow:none;padding:12mm 14mm}
  }
  @page{size:A4;margin:0}
</style>

/* -------------------------------------------------------------------- render */
function render(lang){
  var d = CV[lang];
  document.documentElement.lang = lang;

  var contact = d.contact.map(function(c){
    return '<span><b>'+c[0]+':</b> '+c[1]+'</span>';
  }).join("");

  function bullets(arr){
    return arr && arr.length
      ? '<ul>'+arr.map(function(b){return '<li>'+b+'</li>';}).join("")+'</ul>' : '';
  }

  var projects = d.projects.map(function(p){
    return '<div class="item"><div class="t">'+p.t+'</div>'+
      '<div class="tech">'+p.tech+'</div>'+bullets(p.bullets)+'</div>';
  }).join("");

  function orgBlock(list){
    return list.map(function(e){
      var meta = (e.org || e.y)
        ? '<div class="m"><span class="org">'+(e.org||'')+'</span><span>'+(e.y||'')+'</span></div>' : '';
      return '<div class="item"><div class="t">'+e.t+'</div>'+meta+bullets(e.bullets)+'</div>';
    }).join("");
  }

  var skills = d.skills.map(function(s){
    return '<div class="skwrap"><div class="g">'+s.g+'</div><div class="chips">'+
      s.items.map(function(i){return '<span>'+i+'</span>';}).join("")+'</div></div>';
  }).join("");

  var langs = d.langs.map(function(l){
    return '<div><b>'+l[0]+'</b> — <em>'+l[1]+'</em></div>';
  }).join("");

  var certs = '<ul class="tight">'+d.certs.map(function(c){return '<li>'+c+'</li>';}).join("")+'</ul>';

  document.getElementById("sheet").innerHTML =
    '<header class="cv"><h1>'+d.name+'</h1><div class="role">'+d.role+'</div>'+
      '<div class="contact">'+contact+'</div></header>'+
    '<p class="summary">'+d.summary+'</p>'+
    '<div class="cols"><div class="main">'+
      '<section><h2>'+d.expTitle+'</h2>'+orgBlock(d.exp)+'</section>'+
      '<section><h2>'+d.projTitle+'</h2>'+projects+'</section>'+
      '<section><h2>'+d.actTitle+'</h2>'+orgBlock(d.act)+'</section>'+
    '</div><div class="side">'+
      '<section><h2>'+d.eduTitle+'</h2>'+orgBlock(d.edu)+'</section>'+
      '<section><h2>'+d.skTitle+'</h2>'+skills+'</section>'+
      '<section><h2>'+d.langTitle+'</h2><div class="langs">'+langs+'</div></section>'+
      '<section><h2>'+d.certTitle+'</h2>'+certs+'</section>'+
    '</div></div>'+
    '<footer class="cv">'+d.footer+'</footer>';

  document.getElementById("en").classList.toggle("on", lang==="en");
  document.getElementById("fr").classList.toggle("on", lang==="fr");
  document.title = d.name + " — CV";
}

document.getElementById("en").onclick = function(){ render("en"); };
document.getElementById("fr").onclick = function(){ render("fr"); };
document.getElementById("print").onclick = function(){ window.print(); };
render("en");
